[package]
name = "betterwx-desktop"
version = "2.2.0"
edition = "2024"
build = "build.rs"

[[bin]]
name = "BetterWX-Desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
betterwx = { path = ".." }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "system-proxy", "json"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
ed25519-dalek = "2"
semver = "1"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Security_WinTrust", "Win32_Security_Cryptography"] }

[dev-dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
